services:
  app:
    container_name: olinda-app
    build:
      context: .
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.olinda-http.rule=Host(`olinda.portaprojetos.online`)"
      - "traefik.http.routers.olinda-http.entrypoints=http"
      - "traefik.http.routers.olinda-http.middlewares=olinda-https"
      - "traefik.http.middlewares.olinda-https.redirectscheme.scheme=https"
      - "traefik.http.routers.olinda.rule=Host(`olinda.portaprojetos.online`)"
      - "traefik.http.routers.olinda.entrypoints=https"
      - "traefik.http.routers.olinda.tls=true"
      - "traefik.http.routers.olinda.tls.certresolver=letsencrypt"
      - "traefik.http.services.olinda.loadbalancer.server.port=5000"
      - "traefik.docker.network=coolify"
    environment:
      DEBUG: "False"
      FLASK_APP: run.py
      SECRET_KEY: ${SERVICE_HEX_64_RASTREK:?configure SERVICE_HEX_64_RASTREK}
      ASSETS_ROOT: /static
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-olinda_user}:${SERVICE_PASSWORD_64_POSTGRES:?configure SERVICE_PASSWORD_64_POSTGRES}@postgres:5432/${POSTGRES_DB:-olinda_db}
      INITIAL_ADMIN_EMAIL: ${INITIAL_ADMIN_EMAIL:-admin@olindaaguiar.com}
      INITIAL_ADMIN_PASSWORD: ${INITIAL_ADMIN_PASSWORD:-}
      API_INTEGRATION_KEY: ${API_INTEGRATION_KEY:-olinda_secret_key_2026}
    command:
      - /bin/sh
      - -c
      - flask db upgrade && exec gunicorn --bind 0.0.0.0:5000 --workers 2 --access-logfile - --error-logfile - --timeout 60 run:app
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - "5000"
    ports:
      - "127.0.0.1:5002:5000"
    volumes:
      - app_images:/app/apps/static/images
    networks:
      - coolify
      - default
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  postgres:
    container_name: olinda-postgres
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-olinda_db}
      POSTGRES_USER: ${POSTGRES_USER:-olinda_user}
      POSTGRES_PASSWORD: ${SERVICE_PASSWORD_64_POSTGRES:?configure SERVICE_PASSWORD_64_POSTGRES}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - default
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    name: olinda_postgres_data
  app_images:
    name: olinda_app_images

networks:
  coolify:
    external: true
  default:
