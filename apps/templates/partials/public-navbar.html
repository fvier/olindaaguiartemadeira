<script>
    (() => {
        // Theme initialization
        const savedTheme = localStorage.getItem('gps_landing_theme') || 'light';
        const savedAccent = localStorage.getItem('gps_color_palette') || localStorage.getItem('gps_landing_accent') || 'gold';
        document.documentElement.setAttribute('data-bs-theme', savedTheme);
        document.documentElement.setAttribute('data-landing-accent', savedAccent);

        // Theme toggle button
        const toggle = document.getElementById('landing-theme-toggle');
        const moonIcon = document.getElementById('landing-theme-moon');
        const sunIcon = document.getElementById('landing-theme-sun');
        if (toggle && moonIcon && sunIcon) {
            function updateThemeButtons() {
                const dark = document.documentElement.getAttribute('data-bs-theme') === 'dark';
                moonIcon.classList.toggle('d-none', dark);
                sunIcon.classList.toggle('d-none', !dark);
                toggle.title = dark ? 'Ativar tema claro' : 'Ativar tema escuro';
                toggle.setAttribute('aria-pressed', dark ? 'true' : 'false');
            }
            toggle.addEventListener('click', () => {
                const nextTheme = document.documentElement.getAttribute('data-bs-theme') === 'dark' ? 'light' : 'dark';
                document.documentElement.setAttribute('data-bs-theme', nextTheme);
                localStorage.setItem('gps_landing_theme', nextTheme);
                updateThemeButtons();
            });
            updateThemeButtons();
        }

        // Palette selector
        const paletteOptions = [...document.querySelectorAll('.landing-palette-option')];
        if (paletteOptions.length > 0) {
            function updatePaletteUI() {
                const currentAccent = document.documentElement.getAttribute('data-landing-accent') || 'gold';
                paletteOptions.forEach(option => {
                    const active = option.dataset.accent === currentAccent;
                    option.classList.toggle('active', active);
                    option.setAttribute('aria-pressed', active ? 'true' : 'false');
                });
            }
            paletteOptions.forEach(option => option.addEventListener('click', () => {
                document.documentElement.setAttribute('data-landing-accent', option.dataset.accent);
                localStorage.setItem('gps_landing_accent', option.dataset.accent);
                localStorage.setItem('gps_color_palette', option.dataset.accent);
                updatePaletteUI();
            }));
            updatePaletteUI();
        }
    })();
</script>
