<!-- Google Reviews Top Bar (Self-Contained Component) -->
<style>
    .google-reviews-bar {
        background-color: #f8fafc;
        border-bottom: 1px solid #e2e8f0;
        font-size: 13px;
        color: #334155;
        padding: 5px 0;
        font-family: 'Outfit', -apple-system, BlinkMacSystemFont, sans-serif;
        line-height: 1.4;
    }
    html[data-bs-theme="dark"] .google-reviews-bar {
        background-color: #0b1322;
        border-bottom: 1px solid #1e293b;
        color: #94a3b8;
    }
    .google-reviews-bar .dark-text-light {
        color: #0f172a;
    }
    html[data-bs-theme="dark"] .google-reviews-bar .dark-text-light {
        color: #f1f5f9 !important;
    }
    .reviews-carousel {
        position: relative;
        overflow: hidden;
        height: 20px;
        max-width: 320px;
    }
    .reviews-track {
        display: flex;
        flex-direction: column;
        transition: transform 0.5s ease-in-out;
    }
    .review-item {
        display: flex;
        align-items: center;
        gap: 8px;
        height: 20px;
        white-space: nowrap;
        text-overflow: ellipsis;
        overflow: hidden;
        font-size: 13px;
    }
    .review-avatar {
        width: 18px !important;
        height: 18px !important;
        min-width: 18px !important;
        min-height: 18px !important;
        max-width: 18px !important;
        max-height: 18px !important;
        border-radius: 50% !important;
        object-fit: cover !important;
        display: inline-block !important;
        flex: 0 0 18px !important;
    }
    @media (max-width: 575.98px) {
        .google-reviews-bar {
            font-size: 11px;
            padding: 4px 0;
        }
        .reviews-carousel {
            max-width: 180px !important;
            font-size: 11px;
        }
        .review-item {
            font-size: 11px;
            gap: 5px;
        }
        .google-reviews-badge-text {
            display: none !important;
        }
    }
</style>

<div class="google-reviews-bar">
    <div class="container d-flex justify-content-between align-items-center">
        <!-- Esquerda: Nota Google & Estrelas -->
        <div class="d-flex align-items-center gap-1 gap-sm-2 fw-semibold">
            <i class="ri-google-fill fs-16" style="color: #c85a17;"></i>
            <span class="google-reviews-badge-text">Google</span>
            <span class="text-dark fw-bold dark-text-light ms-1">4.9/5</span>
            <span class="stars-color text-warning d-inline-flex gap-0.5" style="font-size: 11px;"><i class="ri-star-fill"></i><i class="ri-star-fill"></i><i class="ri-star-fill"></i><i class="ri-star-fill"></i><i class="ri-star-fill"></i></span>
            <span class="text-muted fs-11 ms-1 d-none d-md-inline">(140+ avaliações)</span>
        </div>

        <!-- Centro: Carrossel com Foto + Nome + 5 Estrelas (Sem as frases) -->
        <div class="reviews-carousel flex-grow-1 ms-2 ms-sm-4 text-center text-md-start" style="max-width: 320px; height: 20px; overflow: hidden; position: relative;">
            <div class="reviews-track" id="reviewsTrack" style="display: flex; flex-direction: column; transition: transform 0.5s ease-in-out;">
                <div class="review-item" style="height: 20px; display: flex; align-items: center; gap: 8px; white-space: nowrap; overflow: hidden;">
                    <img src="{{ config.ASSETS_ROOT }}/images/users/avatar-3.jpg" class="review-avatar" width="18" height="18" style="width:18px;height:18px;min-width:18px;min-height:18px;max-width:18px;max-height:18px;border-radius:50%;object-fit:cover;flex-shrink:0;" alt="Mariana A.">
                    <span class="fw-bold text-dark dark-text-light fs-13">Mariana Albuquerque</span>
                    <span class="stars-color text-warning d-inline-flex gap-0.5" style="font-size: 11px;"><i class="ri-star-fill"></i><i class="ri-star-fill"></i><i class="ri-star-fill"></i><i class="ri-star-fill"></i><i class="ri-star-fill"></i></span>
                </div>
                <div class="review-item" style="height: 20px; display: flex; align-items: center; gap: 8px; white-space: nowrap; overflow: hidden;">
                    <img src="{{ config.ASSETS_ROOT }}/images/users/avatar-6.jpg" class="review-avatar" width="18" height="18" style="width:18px;height:18px;min-width:18px;min-height:18px;max-width:18px;max-height:18px;border-radius:50%;object-fit:cover;flex-shrink:0;" alt="Helena V.">
                    <span class="fw-bold text-dark dark-text-light fs-13">Helena Vasconcelos</span>
                    <span class="stars-color text-warning d-inline-flex gap-0.5" style="font-size: 11px;"><i class="ri-star-fill"></i><i class="ri-star-fill"></i><i class="ri-star-fill"></i><i class="ri-star-fill"></i><i class="ri-star-fill"></i></span>
                </div>
                <div class="review-item" style="height: 20px; display: flex; align-items: center; gap: 8px; white-space: nowrap; overflow: hidden;">
                    <img src="{{ config.ASSETS_ROOT }}/images/users/avatar-9.jpg" class="review-avatar" width="18" height="18" style="width:18px;height:18px;min-width:18px;min-height:18px;max-width:18px;max-height:18px;border-radius:50%;object-fit:cover;flex-shrink:0;" alt="Dra. Cecília M.">
                    <span class="fw-bold text-dark dark-text-light fs-13">Dra. Cecília Meireles</span>
                    <span class="stars-color text-warning d-inline-flex gap-0.5" style="font-size: 11px;"><i class="ri-star-fill"></i><i class="ri-star-fill"></i><i class="ri-star-fill"></i><i class="ri-star-fill"></i><i class="ri-star-fill"></i></span>
                </div>
            </div>
        </div>

        <!-- Direita: Selo Verificado -->
        <div class="d-none d-lg-block fs-11 text-muted">
            <i class="ri-shield-check-line text-success"></i> Ateliê Verificado no Google
        </div>
    </div>
</div>

<script>
    (() => {
        const track = document.getElementById('reviewsTrack');
        if (track && !window.__reviewsTrackInit) {
            window.__reviewsTrackInit = true;
            let currentIndex = 0;
            const items = track.querySelectorAll('.review-item');
            const itemCount = items.length;
            if (itemCount > 1) {
                setInterval(() => {
                    currentIndex = (currentIndex + 1) % itemCount;
                    track.style.transform = `translateY(-${currentIndex * 20}px)`;
                }, 4000);
            }
        }
    })();
</script>
