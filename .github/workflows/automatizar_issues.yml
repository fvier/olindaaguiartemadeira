name: Automatizar Criação de Issues

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  create-issues:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      - name: Executar Automação de Issues via GitHub CLI
        run: |
          create_issue_if_not_exists() {
            local title="$1"
            local labels="$2"
            local body="$3"

            echo "Verificando se a issue já existe: '$title'..."
            existing=$(gh issue list --search "\"$title\" in:title" --state all --json number --jq '. | length')

            if [ "$existing" -eq 0 ]; then
              echo "➕ Criando nova Issue: '$title'"
              gh issue create --title "$title" --body "$body" --label "$labels"
            else
              echo "ℹ️ Issue já existe ($existing encontrada). Pulando criação."
            fi
          }

          echo "🚀 Iniciando automação de cadastro de Issues para Olinda Aguiar..."

          # 1. Vitrine & Galeria Digital
          create_issue_if_not_exists \
            "[FEAT] Desenvolver Vitrine e Galeria Digital do Ateliê Olinda Aguiar" \
            "enhancement" \
            "### 📌 Descrição
          Desenvolver a interface visual principal inspirada na fachada colonial e na identidade de marcenaria fina de Olinda Aguiar.

          ### 📑 Documentos de Referência
          - [docs/plano_personalizacao.md](./docs/plano_personalizacao.md)
          - [docs/prompt_ia.md](./docs/prompt_ia.md)
          - [README.md](./README.md)

          ### ✅ Critérios de Aceite
          - [ ] Criar layout elegante com a paleta colonial (coral terracota, azul cobalto, vermelho colonial e acabamentos de madeira).
          - [ ] Incorporar as fotos de alta qualidade de referências/ na galeria.
          - [ ] Garantir responsividade total para dispositivos móveis e desktop."

          # 2. Catálogo de Peças
          create_issue_if_not_exists \
            "[FEAT] Implementar Catálogo Interativo de Peças e Esculturas em Madeira" \
            "enhancement" \
            "### 📌 Descrição
          Implementar o catálogo interativo para visualização de peças autorais, tipos de madeira nobre e especificações artísticas.

          ### 📑 Documentos de Referência
          - [docs/plano_personalizacao.md](./docs/plano_personalizacao.md)
          - [docs/diretrizes_documentacao.md](./docs/diretrizes_documentacao.md)

          ### ✅ Critérios de Aceite
          - [ ] Estruturar modelos de dados para peças (nome, tipo de madeira, dimensões, fotos, status de disponibilidade).
          - [ ] Filtros por categorias (esculturas, móveis orgânicos, painéis, peças decorativas).
          - [ ] Exibição de selo de peça exclusiva / autoral."

          # 3. Canal WhatsApp
          create_issue_if_not_exists \
            "[FEAT] Integrar Canal de Orçamentos e Encomendas via WhatsApp" \
            "enhancement" \
            "### 📌 Descrição
          Permitir que clientes iniciem conversas diretas pelo WhatsApp com mensagem pré-preenchida sobre a peça desejada.

          ### 📑 Documentos de Referência
          - [docs/plano_personalizacao.md](./docs/plano_personalizacao.md)

          ### ✅ Critérios de Aceite
          - [ ] Botão de contato rápido em cada peça com link parametrizado (WhatsApp API).
          - [ ] Formulário de solicitação de projeto sob medida."

          # 4. Otimização de Imagens
          create_issue_if_not_exists \
            "[CONFIG] Pipeline de Otimização de Imagens e Assets em Alta Resolução" \
            "enhancement" \
            "### 📌 Descrição
          Configurar pipeline de processamento e compressão WebP/AVIF para carregar fotos em alta definição com rapidez.

          ### 📑 Documentos de Referência
          - [docs/ajuda_infra.md](./docs/ajuda_infra.md)
          - [docs/politica_backup.md](./docs/politica_backup.md)

          ### ✅ Critérios de Aceite
          - [ ] Otimização de imagens sem perda de qualidade visual perceptível.
          - [ ] Lazy loading em todas as galerias."

          # 5. Identidade Visual
          create_issue_if_not_exists \
            "[DOCS] Documentar Manual de Identidade Visual e Estilo Colonial Contemporâneo" \
            "documentation" \
            "### 📌 Descrição
          Elaborar guia de estilos (cores, tipografia, referências fotográficas do casarão histórico).

          ### 📑 Documentos de Referência
          - [docs/prompt_ia.md](./docs/prompt_ia.md)
          - [docs/diretrizes_documentacao.md](./docs/diretrizes_documentacao.md)

          ### ✅ Critérios de Aceite
          - [ ] Especificar códigos hexadecimais das cores oficiais.
          - [ ] Definir famílias tipográficas para títulos e corpo."

          echo "✅ Concluída automação de Issues."
